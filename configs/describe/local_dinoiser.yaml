# Spatial CLIP-Dissect of local SAE latents with CLIP-DINOiser dense features.
# Paths are passed on the command line:
#   --activations --image_dir --sample_stride --concept_set --dinoiser_ckpt --output_dir
# Or compute activations first (--activations none):
#   --sae_checkpoint --model_config --patch_features --sae_batch_size

layer_name: z_local
sae_checkpoint: null
model_config: null
patch_features: null
sae_batch_size: null
cache_dir: null
batch_size: 200
num_workers: 8
device: cuda:0

# CLIP-DINOiser (official release: open_clip ViT-B-16 laion2b backbone)
clip_model: ViT-B-16
clip_pretrained: laion2b_s34b_b88k
gamma: 0.2
image_size: 224

# soft-WPMI
top_k: 100
softmax_temp: 10.0
lam: 1.0
p_start: 0.998
p_end: 0.97
min_prob: 1.0e-7
unit_batch_size: 32
