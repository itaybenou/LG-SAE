# DINOv2 ViT-B/14 features for PartImageNet: patch tokens (256 x 768) and CLS token (768),
# both from the penultimate block's raw residual stream, as in configs/shards/dinov2_vitb14.yaml.
# image_dir and output_dir are passed on the command line.

backbone: dinov2
model_name: dinov2_vitb14
token_layer: 11
hub_repo: ~/.cache/torch/hub/facebookresearch_dinov2_main
image_size: 224
batch_size: 128
num_workers: 4
device: cuda:0
